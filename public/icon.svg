<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Barcode Vertical Lines (Top subtle background) -->
  <g opacity="0.25" fill="#ffffff">
    <rect x="110" y="80" width="8" height="70" rx="4" />
    <rect x="130" y="80" width="16" height="70" rx="4" />
    <rect x="160" y="80" width="6" height="70" rx="3" />
    <rect x="180" y="80" width="22" height="70" rx="4" />
    <rect x="220" y="80" width="10" height="70" rx="4" />
    <rect x="245" y="80" width="18" height="70" rx="4" />
    <rect x="280" y="80" width="8" height="70" rx="4" />
    <rect x="305" y="80" width="26" height="70" rx="4" />
    <rect x="345" y="80" width="10" height="70" rx="4" />
    <rect x="370" y="80" width="20" height="70" rx="4" />
  </g>

  <!-- Red Laser Scanner Beam -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#ef4444" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="256" cy="180" r="6" fill="#ffffff" />

  <!-- Isometric Warehouse Spare Parts Box -->
  <g transform="translate(256, 280)">
    <!-- Top Face -->
    <path d="M 0,-90 L 95,-35 L 0,20 L -95,-35 Z" fill="#ef4444" />
    <!-- Left Face -->
    <path d="M -95,-35 L 0,20 L 0,130 L -95,75 Z" fill="#b91c1c" />
    <!-- Right Face -->
    <path d="M 0,20 L 95,-35 L 95,75 L 0,130 Z" fill="#991b1b" />

    <!-- Tape / Package Band -->
    <path d="M -25,-75 L 25,-46 L 0,-32 L -50,-61 Z" fill="#ffffff" opacity="0.3" />
    <path d="M 0,20 L 0,130 L 25,115 L 25,5 Z" fill="#ffffff" opacity="0.15" />

    <!-- Gear / Spare Part Emblem on Front Face -->
    <circle cx="-47" cy="48" r="18" fill="none" stroke="#fecaca" stroke-width="4" stroke-dasharray="6,4" />
    <circle cx="-47" cy="48" r="8" fill="#fecaca" />
  </g>

  <!-- Brand Typography Badge: B1 -->
  <g transform="translate(330, 360)">
    <rect x="0" y="0" width="110" height="60" rx="16" fill="#dc2626" />
    <text x="55" y="42" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="1">B1</text>
  </g>
</svg>
